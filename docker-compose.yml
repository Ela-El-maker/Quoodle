services:
  # -----------------------------------------------------------------------------
  # DATABASE (MySQL) - Primary Store for Laravel
  # -----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: quoodle-db
    ports:
      - "${QUOODLE_DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: secure_device
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: quoodle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 20s
      start_period: 30s
      retries: 10
    networks:
      - quoodle-net

  # -----------------------------------------------------------------------------
  # REDIS - Shared Cache & Message Queue
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: quoodle-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quoodle-net

  # -----------------------------------------------------------------------------
  # CONTROL PLANE (Laravel)
  # -----------------------------------------------------------------------------
  control-plane:
    build:
      context: ./quoodle-control-plane
      dockerfile: Dockerfile
    container_name: quoodle-control-plane
    ports:
      - "${QUOODLE_CONTROL_PLANE_PORT:-8088}:80"
    environment:
      APP_NAME: "Quoodle Control Plane"
      APP_ENV: local
      APP_KEY: "base64:QxkzZLJ3rLZLy960pyF2CN1TRfB2glfQOh4vZBI0pHY="
      APP_DEBUG: "true"
      APP_URL: http://localhost:${QUOODLE_CONTROL_PLANE_PORT:-8088}
      DEFAULT_USER_ROLE: "operator"
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@quoodle.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-password}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME:-Quoodle Admin}

      DB_CONNECTION: mysql
      DB_HOST: quoodle-db
      DB_PORT: 3306
      DB_DATABASE: secure_device
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}

      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      REDIS_CLIENT: predis

      # Integration
      FASTAPI_BASE_URL: http://gateway:8000/api/v1
      LARAVEL_SERVICE_PRIVATE_KEY_B64: "Hvx/4W6Qr6WYoQ2eXHJt/JUDjg1CH1Gw1MTXJGS3gg4Rp1/SRZgsQKdLoc9oOorSTZcxo8dMQ1T0nrSYCq1Dkg=="
      FASTAPI_SERVICE_PUBLIC_KEY_B64: "ddGZHNgSdDOPD88DnchOKQjYtgUeEpKAi1t6+MS8yRg="
      REQUIRE_FASTAPI_SIGNATURE: "true"
      POLICY_HASH: "sha256:4058fa9b252a07e03ee6ac2585e6424973427f953b6763b48679b61acafe49d2"
      POLICY_VERSION: "2026-01-21"
      ALLOW_DEVICE_REPAIR_WITH_HWID: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quoodle-net

  # -----------------------------------------------------------------------------
  # GATEWAY (FastAPI)
  # -----------------------------------------------------------------------------
  gateway:
    build:
      context: ./quoodle-gateway
      dockerfile: Dockerfile
    container_name: quoodle-gateway
    ports:
      - "8000:8000"
    environment:
      # Core
      HEARTBEAT_INTERVAL_SECONDS: 30
      TELEMETRY_INTERVAL_SECONDS: 60
      POLICY_HASH: "sha256:4058fa9b252a07e03ee6ac2585e6424973427f953b6763b48679b61acafe49d2"
      POLICY_VERSION: "2026-01-21"
      CONTROLLER_ID: "dev_controller_01"

      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: "quoodle:"

      # Integration
      LARAVEL_WEBHOOK_BASE: http://control-plane:80/api/v1/webhook
      JWKS_URL: http://control-plane:80/.well-known/jwks.json

      # Security (Dev Defaults)
      REQUIRE_ED25519: "true"
      ALLOW_DEV_SIG_FALLBACK: "false"
      REQUIRE_AGENT_SEQ: "true"
      REQUIRE_LARAVEL_SIGNATURE: "true"
      ENABLE_TEST_ENDPOINTS: "false"
      LARAVEL_SERVICE_PUBKEY_B64: "Eadf0kWYLECnS6HPaDqK0k2XMaPHTENU9J60mAqtQ5I="
      SIGN_LARAVEL_WEBHOOKS: "true"
      FASTAPI_SERVICE_PRIVATE_KEY_B64: "QwY6n5+wq5TzRIgH1sg+QTqJcHOvq46IcAHsmgeQXLl10Zkc2BJ0M48PzwOdyE4pCNi2BR4SkoCLW3r4xLzJGA=="
      ED25519_PRIVATE_KEY_B64: "R/zVAF4DWvfSMEvqtcTy0btMdAsKcPFycblZoTmurh11Gabg6ET+5xd5Fx6ELKv5ttYmxCMTo8PBeZabIRl36w=="

    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quoodle-net

networks:
  quoodle-net:
    driver: bridge

volumes:
  db_data:
  redis_data:
