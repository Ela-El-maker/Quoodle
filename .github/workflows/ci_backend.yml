name: Laravel CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Ensure sodium_compat
        run: composer require paragonie/sodium_compat --working-dir=quoodle-control-plane --no-interaction || true
      - name: Install deps
        run: composer install --working-dir=quoodle-control-plane --no-interaction
      - name: Lint
        run: cd quoodle-control-plane && ./vendor/bin/pint --test || true
      - name: Tests
        run: cd quoodle-control-plane && php artisan test --testsuite=Feature
