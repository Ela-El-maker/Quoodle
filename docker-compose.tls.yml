services:
  gateway:
    ports:
      - "${QUOODLE_GATEWAY_TLS_PORT:-8443}:8000"
    environment:
      GATEWAY_TLS_CERT_FILE: /certs/gateway.crt
      GATEWAY_TLS_KEY_FILE: /certs/gateway.key
    volumes:
      - ./certs:/certs:ro

  control-plane:
    ports:
      - "${QUOODLE_CONTROL_PLANE_HTTP_PORT_TLS:-8080}:80"
      - "${QUOODLE_CONTROL_PLANE_HTTPS_PORT_TLS:-8444}:443"
    volumes:
      - ./certs:/certs:ro
      - ./quoodle-control-plane/docker/nginx.tls.conf:/etc/nginx/sites-available/default:ro
